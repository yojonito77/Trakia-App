name: Empaquetar Trakia APK
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Descargar app.jsx
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Preparar y compilar todo
      run: |
        npm create vite@latest trakia-app -- --template react --yes
        cd trakia-app
        
        npm install
        npm install lucide-react @capacitor/cli @capacitor/core @capacitor/android
        npm install -D tailwindcss postcss autoprefixer
        
        # Crear configuración de Tailwind directamente sin comandos npx
        echo "/** @type {import('tailwindcss').Config} */" > tailwind.config.js
        echo "export default { content: ['./index.html', './src/**/*.{js,ts,jsx,tsx}'], theme: { extend: {} }, plugins: [], }" >> tailwind.config.js
        
        echo "export default { plugins: { tailwindcss: {}, autoprefixer: {}, }, }" > postcss.config.js
        
        echo "@tailwind base;" > src/index.css
        echo "@tailwind components;" >> src/index.css
        echo "@tailwind utilities;" >> src/index.css
        
        cp ../app.jsx src/App.jsx
        
        npm run build
        
        # Crear configuración de Capacitor directamente
        echo '{"appId": "com.trakia.app", "appName": "Trakia", "webDir": "dist"}' > capacitor.config.json
        
        npx --yes @capacitor/cli add android
        npx --yes @capacitor/cli sync android

    - name: Generar instalador APK
      working-directory: ./trakia-app/android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Subir Trakia-APK
      uses: actions/upload-artifact@v4
      with:
        name: Trakia-APK
        path: trakia-app/android/app/build/outputs/apk/debug/app-debug.apk
