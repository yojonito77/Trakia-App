name: Empaquetar Trakia APK
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Descargar app.jsx del repositorio
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Configurar Java (Para Android)
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Construir la App Web
      run: |
        npm create vite@latest trakia-app -- --template react
        cd trakia-app
        npm install
        npm install recharts lucide-react clsx tailwind-merge framer-motion
        npm install -D tailwindcss postcss autoprefixer
        npx tailwindcss init -p
        echo "/** @type {import('tailwindcss').Config} */" > tailwind.config.js
        echo "export default { content: ['./index.html', './src/**/*.{js,ts,jsx,tsx}'], theme: { extend: {} }, plugins: [], }" >> tailwind.config.js
        echo "@tailwind base; @tailwind components; @tailwind utilities;" > src/index.css
        cp ../app.jsx src/App.jsx
        npm run build

    - name: Generar Estructura Android
      run: |
        cd trakia-app
        npm install @capacitor/cli @capacitor/core @capacitor/android
        npx @capacitor/cli init Trakia com.trakia.app --web-dir dist
        npx @capacitor/cli add android
        npx @capacitor/cli sync android

    - name: Compilar APK Final
      working-directory: ./trakia-app/android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Guardar archivo listo para descargar
      uses: actions/upload-artifact@v4
      with:
        name: Trakia-APK
        path: trakia-app/android/app/build/outputs/apk/debug/app-debug.apk
